<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Tesla OAuth Callback</title>
<style>
body { font-family: -apple-system, Arial, sans-serif; max-width: 600px; margin: 60px auto; padding: 0 20px; }
h1 { font-size: 20px; }
.box { background: #f4f4f4; padding: 16px; border-radius: 8px; word-break: break-all; font-family: monospace; margin-top: 12px; }
.label { font-weight: bold; margin-top: 20px; }
</style>
</head>
<body>
<h1>Tesla Authorization Callback</h1>
<p>Copy the <strong>code</strong> value below — you'll need it to exchange for an access/refresh token.</p>
 
<div class="label">Authorization Code:</div>
<div class="box" id="code">(reading URL...)</div>
 
<div class="label">State:</div>
<div class="box" id="state">(reading URL...)</div>
 
<div class="label">Full Query String (for debugging):</div>
<div class="box" id="raw">(reading URL...)</div>
 
<script>
const params = new URLSearchParams(window.location.search);
document.getElementById('code').textContent = params.get('code') || '(none found)';
document.getElementById('state').textContent = params.get('state') || '(none found)';
document.getElementById('raw').textContent = window.location.search || '(empty)';
</script>
</body>
</html>
